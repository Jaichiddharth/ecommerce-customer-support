# UnoCX conversation test set
# ------------------------------------------------------------------
# Run:  python -m scripts.run_eval                 (in-process, uses LLM_PROVIDER from .env)
#       python -m scripts.run_eval --api http://localhost:8000
#
# Case fields
#   message / history / steps   one message, prior turns, or a multi-step conversation
#   user / page / settings      passed straight into the /v1/chat request
#   repeat: N                   send the same message N times (rate-limit tests)
#   feedback: true|false        (in steps) send thumbs up/down for that step's run
#   gold: ["Refund timelines"]  article title(s) that SHOULD be retrieved (substring match on the chunk
#                               title). Used for retrieval metrics and to blame failures on the right stage.
#   keep_user_id: true          send user.id unchanged (order-status cases use real customer ids from
#                               data/ecommerce_orders_clean.csv, loaded with scripts.load_orders)
#   allow_repeat: true          (in steps) allow the reply to equal the previous one; otherwise a repeated
#                               reply fails the step automatically
#   llm_only: true              needs the real model (meaning, language, reasoning).
#                               Skipped when LLM_PROVIDER=fake.
# expect fields (all optional)
#   outcome: answered | clarify | handover | blocked   (or a list of allowed values)
#   route, handover_reason, action_form, flags_include
#   contains_any, contains_all, not_contains   case-insensitive text checks on the reply
#   not_matches                                regex the reply must NOT match
#   action_type: complaint                     the reply carries this action (e.g. a raised complaint)
#   citation: true                             at least one citation returned
#   not_route                                  route must differ from this
# ------------------------------------------------------------------

# ============ P: policy and FAQ answers (grounded, cited) ============
