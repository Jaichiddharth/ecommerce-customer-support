# ---- Delivered but not received: guidance, then a complaint; refunds go to a person ----
- id: W42
  category: wismo
  title: Delivered but not received - guidance, then complaint, then refund request goes to a person
  keep_user_id: true
  user: {id: "19"}
  why: Reported in testing - the bot kept repeating "it was delivered". It must address the problem instead.
  steps:
    - message: where is my order
      expect: {outcome: answered, route: tool, contains_all: ["UX109185", "delivered"]}
    - message: no, i didnt still get it
      expect: {outcome: answered, route: tool, contains_all: ["UX109185", "neighbours", "tracking number"], flags_include: [order_not_received], not_contains: ["was delivered on"]}
    - message: I already checked with my neighbours and called the courier
      expect: {outcome: answered, route: tool, contains_any: ["CMP-"], flags_include: [order_complaint], action_type: complaint}
    - message: still nothing?
      expect: {outcome: answered, route: tool, contains_any: ["CMP-"], flags_include: [order_complaint]}
    - message: I want my money back
      expect: {outcome: handover, handover_reason: refund_request}

