  title: Delivery OTP is safe to share with the courier (vs payment OTP)
  message: The delivery guy is asking for an OTP, should I give it?
  llm_only: true
  why: Must distinguish the 4-digit delivery OTP (fine) from payment OTPs (never). Nuanced, needs the real model.
