# ============ C: whole conversations (WISMO + help mixed) ============
# From the conversation audit: context switches, follow-ups, repeats, unhappy customers, order problems.
# Every multi-step case also fails automatically if the bot repeats its previous reply.
- id: C01
  category: conversation
  title: Order -> help -> help follow-up -> order again keeps each context straight
  keep_user_id: true
  user: {id: "257"}
  steps:
    - message: where is my order
      expect: {outcome: answered, route: tool, contains_all: ["UX109927"]}
    - message: what is your return policy?
      expect: {outcome: answered, not_route: tool}
    - message: and for sale items?
      expect: {outcome: answered, not_route: tool}
