name: Deploy Unocx to AWS ECS

on:
  push:
    branches:
      - Development

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "761018875755"
  ECR_REPOSITORY: unocx
  ECS_CLUSTER: unocx-dev-cluster
  ECS_SERVICE: unocx-dev-service
  ECS_TASK_DEFINITION: unocx-dev-task
  CONTAINER_NAME: unocx-app

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1.2 Debug OIDC token claims
      - name: Inspect OIDC token claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          export TOKEN
          node -e '
            const token = process.env.TOKEN;
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );
            console.log("Issuer:", payload.iss);
            console.log("Audience:", payload.aud);
            console.log("Subject:", payload.sub);
          '

      # 1.5 Debug GitHub OIDC context
      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch reference: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      # 2. Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::761018875755:role/UnocxGitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Validate build variables
      - name: Validate frontend build variables
        env:
          FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          META_GRAPH_VERSION: ${{ vars.NEXT_PUBLIC_META_GRAPH_VERSION }}
          META_CONFIG_ID: ${{ vars.NEXT_PUBLIC_META_CONFIG_ID }}
          META_APP_ID: ${{ vars.NEXT_PUBLIC_META_APP_ID }}
        run: |
          for name in \
            FIREBASE_API_KEY \
            FIREBASE_AUTH_DOMAIN \
            FIREBASE_PROJECT_ID \
            FIREBASE_STORAGE_BUCKET \
            FIREBASE_MESSAGING_SENDER_ID \
            FIREBASE_APP_ID \
            META_GRAPH_VERSION \
            META_CONFIG_ID \
            META_APP_ID
          do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub repository variable: $name"
              exit 1
            fi
          done

      # 6. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/unocx:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_META_GRAPH_VERSION=${{ vars.NEXT_PUBLIC_META_GRAPH_VERSION }}
            NEXT_PUBLIC_META_CONFIG_ID=${{ vars.NEXT_PUBLIC_META_CONFIG_ID }}
            NEXT_PUBLIC_META_APP_ID=${{ vars.NEXT_PUBLIC_META_APP_ID }}

      # 7. Download existing ECS task definition
      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition \
            --output json > task-definition.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt
          )' task-definition.json > task-definition-clean.json

      # 8. Update only the application container image
      - name: Update container image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: unocx-app
          image: ${{ steps.login-ecr.outputs.registry }}/unocx:${{ github.sha }}

      # 9. Deploy updated task definition to ECS
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: unocx-dev-service
          cluster: unocx-dev-cluster
          wait-for-service-stability: true